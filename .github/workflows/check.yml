name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
            node: '24'
          - os: ubuntu-latest
            python: '3.12'
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install -r requirements-wiki.txt
      - run: python -X utf8 scripts/check.py
  sdk-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-wiki.txt AstrBot==4.29.3
      - run: python -X utf8 scripts/sdk_pipeline.py
