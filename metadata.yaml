name: astrbot_plugin_hd2_suite
display_name: HD2 战况机器人 · 绝地潜兵2 全家桶
desc: |
  《绝地潜兵 2》（Helldivers 2）中文战况机器人全家桶 —— 一个插件装齐全部子系统。

  指令：/战报 /重要指令 /战线 /dss /战役 /查询 /变种 /wiki /btk测伤 /拆毁值 /roll /分析 /帮助 /银河星图 /api。

  特性：
  · 黑金 HUD 图片卡（Steam 深蓝 + 亮黄），超长内容自动合并为单张宽图，分区自左向右阅读
  · 官方 API 快照 + 中文翻译管线，同一快照口径图片/文字双输出
  · 重要指令（MO）首次发现自动推送，战略指令/战略机遇/次要指令三通道展示
  · 战役简报档案墙、星球指挥台、民主空间站、Wiki 全文长卡、七格配装抽取、BTK 武器测伤
  · LLM 行动建议（/分析，可选）、进群欢迎、指令防护、命令日志埋点、API 变更监测

  部署前提：AstrBot 已接入 OneBot v11（SnowLuma/NapCat）或官方 QQ 适配器；
  需复制 config.example.json 为插件目录内 config.json 并填写配置（详见仓库 README 与部署文档）。

  本插件及其文档由 AI（DeepSeek Agent）辅助生成并维护，人工审核后发布。
